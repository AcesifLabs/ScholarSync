# Run standalone from scholarsync-backend/: docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    # postgres:16 plus the pgvector extension (search cache); trixie matches postgres:16's glibc, so existing volumes keep their collation
    image: pgvector/pgvector:pg16-trixie
    environment:
      POSTGRES_DB: scholarsync
      POSTGRES_USER: scholarsync
      POSTGRES_PASSWORD: scholarsync_dev_password
    ports:
      - "127.0.0.1:5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # official MinIO images left Docker Hub/Quay; pgsty is the maintained community build
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: scholarsync
      MINIO_ROOT_PASSWORD: scholarsync_dev_password
    ports:
      - "127.0.0.1:9100:9000" # S3 API (9000 is taken by the backend)
      - "127.0.0.1:9101:9001" # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10


volumes:
  postgres_data:
  minio_data:
