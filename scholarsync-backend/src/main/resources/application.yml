spring:
  application:
    name: scholarsync-backend

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5555/scholarsync}
    username: ${DATABASE_USERNAME:scholarsync}
    password: ${DATABASE_PASSWORD:scholarsync_dev_password}

  docker:
    compose:
      lifecycle-management: start-and-stop
      file: infra/docker-compose.yml
      skip:
        in-tests: false
      profiles:
        active: dev
  devtools:
    livereload:
      enabled: true
    add-properties: false
    restart:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
            redirect-uri: "${REDIRECT_BASE_URL:http://localhost:9000/scholarsync-api}/login/oauth2/code/google"

          orcid:
            client-id: ${ORCID_CLIENT_ID}
            client-secret: ${ORCID_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "${REDIRECT_BASE_URL}/login/oauth2/code/orcid"
            scope: openid, /authenticate

        provider:
          orcid:
            authorization-uri: https://orcid.org/oauth/authorize
            token-uri: https://orcid.org/oauth/token
            user-info-uri: https://orcid.org/oauth/userinfo
            user-name-attribute: sub

external:
  semantic-scholar:
    base-url: ${SEMANTIC_SCHOLAR_BASE_URL:semantic-scholar-base-url}
    api-key: ${SEMANTIC_SCHOLAR_API_KEY:hYk5dQNvb22Elj1cgGNix5wUaB7h6tTlYYwVFu97}
  google:
    client-id: ${GOOGLE_CLIENT_ID:google-client-id.apps.googleusercontent.com}
    client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret}

server:
  port: 9000
  servlet:
    context-path: /scholarsync-api

management:
  endpoints:
    web:
      cors:
        allowed-origins: ${FRONTEND_URL:http://localhost:6969}

jwt:
   secret: ${JWT_SECRET:your-256-bit-secret-key-here-must-be-at-least-32-characters}
   issuer-url: ${JWT_ISSUER_URI:http://localhost:9000}
   expiration-ms: ${JWT_EXPIRATION_MS:86400000}
   frontend-url: ${FRONTEND_URL:http://localhost:6969}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: true

springdotenv:
  enabled: true
  filename: .env.dev.local